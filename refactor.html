<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Поддержка — Help Desk</title>
</head>
<body>
    <a href="#main-content">Перейти к основному содержимому</a>

    <header>
        <p><strong>Help Desk</strong></p>
    </header>

    <nav aria-label="Хлебные крошки">
        <a href="index.html">Главная</a>
    </nav>

    <main id="main-content">
        <h1>Поддержка</h1>

        <section aria-labelledby="search-heading">
            <h2 id="search-heading">Поиск обращения</h2>

            <form action="#" method="get">
                <div>
                    <label for="ticket-number">Номер обращения</label>
                    <input
                        id="ticket-number"
                        name="ticketNumber"
                        type="text"
                        placeholder="Например, 101"
                        aria-describedby="ticket-number-hint"
                    >
                    <p id="ticket-number-hint">
                        Введите номер из письма или личного кабинета.
                    </p>
                </div>

                <button type="submit">Найти</button>
            </form>
        </section>

        <img src="assets/images/support.png" alt="">
    </main>

    <footer>
        <p>Учебный проект Help Desk</p>
    </footer>
</body>
</html>
